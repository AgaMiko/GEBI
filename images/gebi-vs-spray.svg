<rect x="1" y="1" width="898" height="528" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="30" y="44" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">What each notebook clusters on</text>
<text x="30" y="68" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">All three use malignant images and their attention maps (heatmaps), and spectral clustering into 4 clusters.</text>
