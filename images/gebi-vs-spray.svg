<text x="44" y="132" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">SpRay</text>
<text x="44" y="152" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">spray.ipynb</text>
