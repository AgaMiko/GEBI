<symbol id="im" viewBox="0 0 100 100"><g clip-path="url(#t)"><rect width="100" height="100" fill="#ecc5a8"/><path d="M48 28 C62 26 72 36 72 50 C72 64 60 74 47 72 C34 70 27 60 29 47 C30 36 38 29 48 28Z" fill="#7b4a2e"/><path d="M47 40 C55 39 60 45 59 52 C58 59 51 62 45 59 C40 55 40 46 47 40Z" fill="#4a2a19"/></g><rect width="100" height="100" rx="10" fill="none" stroke="#1d6fb8" stroke-width="5"/></symbol>
