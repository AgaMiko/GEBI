<use href="#im" x="196" y="402" width="40" height="40"/>
<path d="M240 422 H256" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="400" width="124" height="44" rx="9" fill="#1d6fb8" fill-opacity="0.09" stroke="#1d6fb8" stroke-width="1.8"/><text x="322.0" y="419.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Isomap</text><text x="322.0" y="436.0" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="middle">image → 10 values</text>
<path d="M386 352 H400 V381.0 H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<path d="M386 422 H400 V393.0 H414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="418" y="365.0" width="142" height="44" rx="9" fill="#475569" fill-opacity="0.09" stroke="#475569" stroke-width="1.8"/><text x="489.0" y="384.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Join</text><text x="489.0" y="401.0" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="middle">30 values per image</text>
<path d="M562 387.0 H572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="576" y="365.0" width="142" height="44" rx="9" fill="#0f8a74" fill-opacity="0.09" stroke="#0f8a74" stroke-width="1.8"/><text x="647.0" y="384.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Spectral</text><text x="647.0" y="401.0" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="middle">clustering</text>
<path d="M720 387.0 H730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="736" y="373.0" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">clusters that group</text>
<text x="736" y="391.0" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">both what the image</text>
<text x="736" y="409.0" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">shows and where the</text>
<text x="736" y="427.0" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">model looks</text>
<text x="30" y="488" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">All inputs are first downscaled to 20% of their size. Both SpRay notebooks also cluster the images on their own, the same way.</text>
<text x="30" y="508" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">GEBI clusters heatmaps alone, images alone, and both joined.</text>
