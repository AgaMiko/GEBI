<rect x="576" y="228" width="142" height="44" rx="9" fill="#0f8a74" fill-opacity="0.09" stroke="#0f8a74" stroke-width="1.8"/><text x="647.0" y="247.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Spectral</text><text x="647.0" y="264.0" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="middle">clustering</text>
<path d="M720 250 H730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="736" y="246" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">clusters of</text>
<text x="736" y="264" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">attention maps</text>
