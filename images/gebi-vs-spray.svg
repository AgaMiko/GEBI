<path d="M240 140 H256" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="118" width="142" height="44" rx="9" fill="#475569" fill-opacity="0.09" stroke="#475569" stroke-width="1.8"/><text x="331.0" y="137.0" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Downscale</text><text x="331.0" y="154.0" font-size="11.5" fill="#334155" font-weight="normal" text-anchor="middle">to 20% of the size</text>
