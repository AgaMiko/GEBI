<text x="44" y="378" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="start">GEBI</text>
<text x="44" y="398" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">GEBI.ipynb</text>
