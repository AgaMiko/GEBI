<path d="M720 140 H730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="736" y="136" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">clusters of</text>
<text x="736" y="154" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">attention maps</text>
